version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.5.1
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qnsc_kb
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 768m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    mem_limit: 128m
    mem_reservation: 32m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        # Local builds skip the ~2.3 GB weight bake, so a rebuild stays quick. The
        # weights are fetched on first use into the hfcache volume below instead, once
        # for all three services.
        BAKE_EMBEDDING_MODEL: "false"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./connector_sources:/app/storage/connectors
      # BAKE_EMBEDDING_MODEL=false above means the weights are downloaded on first use.
      # Without this volume that is ~2.3 GB again on every `docker compose up --build`.
      - hfcache:/opt/huggingface
    # Restrict reloads to application source.  Test runs and Celery's local
    # schedule database must not restart the API and reload the embedding
    # model during ordinary local development.
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src", "--reload-exclude", "tests/*", "--reload-exclude", "celerybeat-schedule*", "--reload-exclude", ".pytest_cache/*"]
    mem_limit: 2g
    mem_reservation: 512m
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/qnsc_kb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # NOTE (arm64 / Apple Silicon): the worker target CANNOT build locally on arm64 —
    # paddlepaddle publishes no aarch64 wheel, and poetry install fails inside the
    # deps-onnx-ocr stage. CI builds x86_64 and that is what runs on Fargate. For local
    # work that needs the worker, build emulated with
    #   docker build --platform linux/amd64 --target worker .
    # (slow under Rosetta) or run the worker from the api image, which carries celery
    # and the full embedding stack and fails only on scanned-file OCR — the api never
    # OCRs. Pre-existing, independent of the ONNX migration.
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        BAKE_EMBEDDING_ONNX: "false"
    volumes:
      - .:/app
      - hfcache:/opt/huggingface
    command: celery -A src.workers.celery_app worker --pool=solo --concurrency=1 --prefetch-multiplier=1 --loglevel=info
    mem_limit: 2g
    mem_reservation: 512m
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/qnsc_kb
      - REDIS_URL=redis://redis:6379/0
      - AUTO_CREATE_SCHEMA=false
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
      - MALLOC_ARENA_MAX=2
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - MICROSOFT_REDIRECT_URI=${MICROSOFT_REDIRECT_URI:-http://localhost:8000/api/v1/connectors/oauth/callback}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/connectors/oauth/callback}
      - CONNECTOR_WEBHOOK_BASE_URL=${CONNECTOR_WEBHOOK_BASE_URL:-}
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
      - MALLOC_ARENA_MAX=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        BAKE_EMBEDDING_ONNX: "false"
    volumes:
      - .:/app
      - hfcache:/opt/huggingface
    command: celery -A src.workers.celery_app beat --loglevel=info
    mem_limit: 256m
    mem_reservation: 64m
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/qnsc_kb
      - REDIS_URL=redis://redis:6379/0
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - MICROSOFT_REDIRECT_URI=${MICROSOFT_REDIRECT_URI:-http://localhost:8000/api/v1/connectors/oauth/callback}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/connectors/oauth/callback}
      - CONNECTOR_WEBHOOK_BASE_URL=${CONNECTOR_WEBHOOK_BASE_URL:-}
      - OMP_NUM_THREADS=1
      - MALLOC_ARENA_MAX=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  hfcache:
