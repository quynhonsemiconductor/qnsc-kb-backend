services:
  db:
    image: ankane/pgvector:v0.5.1
    ports:
      # Loopback-only: dev Postgres uses well-known credentials and must not
      # be reachable from the LAN.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qnsc_kb
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 768m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--requirepass", "devredis"]
    volumes:
      - redisdata:/data
    mem_limit: 128m
    mem_reservation: 32m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a devredis ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        # Baked, because the ONNX loader reads the export from disk and has no runtime
        # download path: unbaked, this container cannot embed at all and every search
        # silently degrades to keyword-only. It is two files, cached as a build layer,
        # and it is the same artifact production runs.
        BAKE_EMBEDDING_MODEL: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - ./connector_sources:/app/storage/connectors
      # Shared HuggingFace cache. The ONNX export itself is baked into the image at
      # /opt/embedding-onnx; this only keeps any incidental hub download out of the
      # per-container layer.
      - hfcache:/opt/huggingface
    # Restrict reloads to application source.  Test runs and Celery's local
    # schedule database must not restart the API and reload the embedding
    # model during ordinary local development.
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src", "--reload-exclude", "tests/*", "--reload-exclude", "celerybeat-schedule*", "--reload-exclude", ".pytest_cache/*"]
    mem_limit: 2g
    mem_reservation: 512m
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/qnsc_kb
      - REDIS_URL=redis://:devredis@redis:6379/0
      # This stack RUNS celery (worker + beat), so the API must not also run the inline
      # loops. JOB_MODE defaults to "inline", and dev never set it: the API was replaying
      # the outbox and dispatching connector syncs at the same time as the worker, and a
      # manual "Sync now" ran the whole provider walk inside the API process instead of on
      # the worker. Production sets this on both services; dev did not.
      - JOB_MODE=celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # NOTE (arm64 / Apple Silicon): the worker target CANNOT build locally on arm64 —
    # paddlepaddle publishes no aarch64 wheel, and poetry install fails inside the
    # deps-onnx-ocr stage. CI builds x86_64 and that is what runs on Fargate. For local
    # work that needs the worker, build emulated with
    #   docker build --platform linux/amd64 --target worker .
    # (slow under Rosetta) or run the worker from the api image, which carries celery
    # and the full embedding stack and fails only on scanned-file OCR — the api never
    # OCRs. Pre-existing, independent of the ONNX migration.
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        BAKE_EMBEDDING_MODEL: "true"
    volumes:
      - .:/app
      - hfcache:/opt/huggingface
    command: celery -A src.workers.celery_app worker --pool=solo --concurrency=1 --prefetch-multiplier=1 --loglevel=info
    mem_limit: 2g
    mem_reservation: 512m
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/qnsc_kb
      - REDIS_URL=redis://:devredis@redis:6379/0
      - JOB_MODE=celery
      - AUTO_CREATE_SCHEMA=false
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
      - MALLOC_ARENA_MAX=2
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - MICROSOFT_REDIRECT_URI=${MICROSOFT_REDIRECT_URI:-http://localhost:8000/api/v1/connectors/oauth/callback}
      - MICROSOFT_CONNECTOR_AUTH_MODE=${MICROSOFT_CONNECTOR_AUTH_MODE:-delegated}
      - MICROSOFT_GRAPH_SCOPE=${MICROSOFT_GRAPH_SCOPE:-https://graph.microsoft.com/.default}
      - MICROSOFT_GRAPH_SUBSCRIPTION_MINUTES=${MICROSOFT_GRAPH_SUBSCRIPTION_MINUTES:-1440}
      - MICROSOFT_SHAREPOINT_SITE_IDS=${MICROSOFT_SHAREPOINT_SITE_IDS:-}
      - MICROSOFT_ONEDRIVE_USER_IDS=${MICROSOFT_ONEDRIVE_USER_IDS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/connectors/oauth/callback}
      - CONNECTOR_WEBHOOK_BASE_URL=${CONNECTOR_WEBHOOK_BASE_URL:-}
      - CONNECTOR_SYNC_DISPATCH_INTERVAL_SECONDS=${CONNECTOR_SYNC_DISPATCH_INTERVAL_SECONDS:-30}
      - CONNECTOR_RECONCILE_INTERVAL_MINUTES=${CONNECTOR_RECONCILE_INTERVAL_MINUTES:-360}
      - CONNECTOR_AUTO_PUBLISH_MODE=${CONNECTOR_AUTO_PUBLISH_MODE:-governed}
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
      - MALLOC_ARENA_MAX=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        BAKE_EMBEDDING_MODEL: "true"
    volumes:
      - .:/app
      - hfcache:/opt/huggingface
    command: celery -A src.workers.celery_app beat --loglevel=info
    mem_limit: 256m
    mem_reservation: 64m
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/qnsc_kb
      - REDIS_URL=redis://:devredis@redis:6379/0
      - JOB_MODE=celery
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - MICROSOFT_REDIRECT_URI=${MICROSOFT_REDIRECT_URI:-http://localhost:8000/api/v1/connectors/oauth/callback}
      - MICROSOFT_CONNECTOR_AUTH_MODE=${MICROSOFT_CONNECTOR_AUTH_MODE:-delegated}
      - MICROSOFT_GRAPH_SCOPE=${MICROSOFT_GRAPH_SCOPE:-https://graph.microsoft.com/.default}
      - MICROSOFT_GRAPH_SUBSCRIPTION_MINUTES=${MICROSOFT_GRAPH_SUBSCRIPTION_MINUTES:-1440}
      - MICROSOFT_SHAREPOINT_SITE_IDS=${MICROSOFT_SHAREPOINT_SITE_IDS:-}
      - MICROSOFT_ONEDRIVE_USER_IDS=${MICROSOFT_ONEDRIVE_USER_IDS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/connectors/oauth/callback}
      - CONNECTOR_WEBHOOK_BASE_URL=${CONNECTOR_WEBHOOK_BASE_URL:-}
      - CONNECTOR_SYNC_DISPATCH_INTERVAL_SECONDS=${CONNECTOR_SYNC_DISPATCH_INTERVAL_SECONDS:-30}
      - CONNECTOR_RECONCILE_INTERVAL_MINUTES=${CONNECTOR_RECONCILE_INTERVAL_MINUTES:-360}
      - CONNECTOR_AUTO_PUBLISH_MODE=${CONNECTOR_AUTO_PUBLISH_MODE:-governed}
      - OMP_NUM_THREADS=1
      - MALLOC_ARENA_MAX=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Migrations do not run from any service's start-up: a scale-out would fire one per
  # replica. This is the one place they run, and it mirrors the production stack's
  # `migrator` service, which dev was missing entirely — leaving no compose path to
  # apply a migration and no hint that one was needed. A new table therefore surfaced
  # as `relation "..." does not exist`, thrown by a beat task every 30 seconds.
  #
  #   docker compose --profile migrate run --rm migrator
  #
  # Behind a profile so `docker compose up` never migrates implicitly. The image's
  # entrypoint bootstraps the least-privilege role first, which no-ops here because
  # APP_DATABASE_ROLE is unset in dev, then runs `alembic upgrade head`.
  migrator:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/qnsc_kb
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  hfcache:
