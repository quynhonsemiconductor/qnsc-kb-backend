[tool.poetry]
name = "qnsc-kb-backend"
version = "0.1.1"
description = "Knowledge Base Backend API for QNSC"
authors = ["quynhonsemiconductor"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.141.0"
uvicorn = {extras = ["standard"], version = ">=0.30.1,<0.53.0"}
pydantic = {extras = ["email"], version = "^2.7.4"}
pydantic-settings = "^2.3.4"
sqlalchemy = "^2.0.31"
alembic = "^1.13.1"
asyncpg = ">=0.29,<0.32"
psycopg2-binary = "^2.9.9"
pgvector = ">=0.3.1,<0.6.0"
celery = "^5.4.0"
redis = ">=5.0.6,<9.0.0"
boto3 = "^1.35.0"
# Floor raised to 2.15.0, not just relocked: ^2.13.0 already ADMITTED the fixed
# releases, so the lock alone pinning 2.13.0 is what osv-scanner was failing on, and a
# future `poetry lock` could pin it again. 2.13.0 carries 28 advisories, the worst at
# CVSS 9.1; 2.14.0 and 2.15.0 are the named fixes.
pyjwt = {extras = ["crypto"], version = "^2.15.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.32"
httpx = ">=0.27,<0.29"
structlog = ">=24.2,<27.0"
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-exporter-otlp-proto-http = "^1.27.0"
bcrypt = "5.0.0"
# Unpinned since the torch images left (PR #54): the <2 ceiling existed for the
# local Paddle/Torch OCR stack, and paddle 3.x declares numpy with no upper bound.
# numpy 2.x is also what onnxruntime 1.28 and every current wheel builds against.
numpy = "^2.0.0"
# Same reasoning as pyjwt above: ^6.15.0 already admitted the fix, the lock pinned
# 6.16.1, which carries 16 advisories. 6.19.0 is the highest named fix.
pypdf = "^6.19.0"
python-docx = "^1.1.2"
openpyxl = "^3.1.5"
python-pptx = "^1.0.2"
pillow = "^12.0.0"
pymupdf = "^1.25.3"
# Markdown structure for PDFs, over the pymupdf above rather than a new engine: it
# reads PyMuPDF's layout model, so it emits real headings where MarkItDown's pdfminer
# path emits none. Headings are what ``split_into_chunks`` splits on and what decides
# whether the LLM restructuring pass is needed, so this is the difference between
# paying a model for structure and reading it off the document.
#
# Held in the 0.2.x line deliberately. From 1.x onward the package tracks PyMuPDF's
# own version numbers and exact-pins them (`pymupdf==1.28.2`), which would hand this
# project's pymupdf range to a transitive dependency and drag in pymupdf_layout. 0.2.9
# asks only for `pymupdf>=1.26.6`, runs against the installed 1.28.2, and measured
# faster than 1.28.2 on the same file (0.29 s vs 1.85 s) for identical structure yield.
pymupdf4llm = "^0.2.9"
# The 0.0.2 pin existed only for the numpy 1.x ceiling above; current releases
# ride numpy 2.
markitdown = "^0.1.7"

# Scanned-document OCR. NOT installed by default: only the WORKER extracts text from
# scanned files, and paddle is ~1 GB. src/domain/source_extraction.py imports it lazily,
# inside the functions that use it, so an image without it serves every other code path
# normally and fails loudly only if asked to OCR — which the API never is.
#
#   poetry install --with ocr
[tool.poetry.group.ocr]
optional = true

[tool.poetry.group.ocr.dependencies]
paddlepaddle = "^3.0.0"
paddleocr = "^3.0.0"

# LOCAL ONLY. torch, sentence-transformers and transformers: the reference implementation the
# ONNX parity gate (tests/unit/test_embedding_backends.py) compares against, the torch rollback
# backend (EMBEDDING_RUNTIME=torch) and the optional cross-encoder reranker. NO image installs
# it: the shipped images embed with ONNX Runtime (the `onnx` group below) and are ~0.8 GB smaller
# without it. A rollback to torch is an older image tag, not a flag. In a checkout:
#
#   poetry install --with ml
[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
sentence-transformers = "^5.7.0"
torch = { version = "^2.13.0", source = "pytorch-cpu" }
# Pinned explicitly even though sentence-transformers pulls it in: that package still
# accepts transformers 4.x, which carries remote-code-execution advisories (GHSA-29pf,
# GHSA-fgcw, both HIGH). 5.5.0 is the first release clear of them.
transformers = "^5.15.0"

# ONNX Runtime: the same embedding model without torch or transformers. Roughly 2 GB
# smaller in every image that embeds, and faster on CPU. Optional because the torch
# group is still the reference implementation — see EMBEDDING_RUNTIME.
[tool.poetry.group.onnx]
optional = true

[tool.poetry.group.onnx.dependencies]
onnxruntime = "^1.24.0"
tokenizers = "^0.22.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.0"
pytest-asyncio = "^1.4.0"
black = "^26.0.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"
