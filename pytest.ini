[pytest]
pythonpath = .
# Without testpaths, a bare `pytest -q` collects from the repository root and walks
# migrations/ and scripts/ looking for tests. Without --strict-markers, a mistyped
# marker — `@pytest.mark.asyncio_` — is silently accepted and its coroutine is never
# awaited, so the test passes without running.
testpaths = tests
addopts = --strict-markers
# `asyncio` is registered here rather than left to pytest-asyncio. The plugin registers it
# when installed, but --strict-markers turns an UNREGISTERED marker into a collection
# ERROR, so a checkout without the dev group installed could no longer collect the four
# files that carry it. Declaring it means strict-markers still catches a typo while the
# suite stays collectable everywhere.
markers =
    asyncio: coroutine test driven by pytest-asyncio when the dev group is installed.
