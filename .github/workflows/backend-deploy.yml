# =============================================================================
# Backend · Deploy — thin caller of the shared reusable (ci).
#
# Triggers:
#   develop → push to main (auto)
#   prod    → push a semver tag v*.*.* (gated by the "production" GitHub Environment's
#             required reviewer, enforced inside the reusable)
#
# The reusable builds and attests on main, promotes that exact image on a tag, runs the
# migrator task, then rolls the ECS services. All ECS_*/RDS/APP_URL configuration is
# read from environment-scoped GitHub variables published by infra-apply.yml; only the
# AWS account id is passed explicitly (least privilege — no `secrets: inherit`).
# =============================================================================
name: Backend · Deploy

on:
  push:
    branches: [main]
    # paths-ignore fires only when EVERY changed file matches, so a shared change still
    # deploys — under-deploying is impossible.
    #
    # `infra/**` is deliberately NOT ignored. Terraform owns the task definition's
    # environment (DATABASE_HOST, REDIS_URL, SOURCE_STORAGE_BUCKET, …), but the
    # ecs-service module sets `ignore_changes = [task_definition]` so the SERVICE is
    # never moved onto the revision Terraform registers — this pipeline owns that. With
    # infra ignored, an infra-only merge would register a correct new task definition
    # that nothing ever rolls onto, and the change would silently not take effect.
    #
    # Cost: a Terraform-only merge rebuilds images it does not strictly need. Minutes of
    # CI in exchange for removing a class of silent drift.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # semver only — no -rc suffix

  # Manual redeploy of whatever main currently holds. DEVELOP ONLY — a prod deploy still
  # requires a semver tag, so this cannot skip that gate. Exists because a merged fix can
  # otherwise become undeployable: if its CI run was cancelled, the fail-closed gate
  # below correctly refuses, and re-running the deploy cannot help because the missing
  # CI run is the problem. An empty commit is no substitute — paths-ignore is evaluated
  # against the changed-file list, and a commit that changes nothing matches every rule.
  workflow_dispatch:

concurrency:
  # Serialise by ENVIRONMENT, not by raw ref: all prod (tag) deploys share one group so
  # prod migrations never run concurrently; develop shares another. The two still run in
  # parallel.
  group: deploy-backend-${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'develop' }}
  cancel-in-progress: false # never cancel a running deploy

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Ordering gate — never roll the app ahead of its own infrastructure.
  #
  # Backend·Deploy and Infrastructure·Apply both fire on the same push as independent
  # workflows. Without sequencing, a commit changing both infra and app code races: the
  # migrator runs against the OLD task definition, still pointing at whatever the infra
  # change was replacing.
  #
  # Deterministic, and keyed on the commit sha so it can never wait on an unrelated run:
  #   - commit does NOT touch infra/(live|modules) → no infra run exists, proceed
  #   - commit DOES touch them                     → wait for that run on THIS sha
  # ───────────────────────────────────────────────────────────────────────────
  wait-for-infra:
    name: Wait for infrastructure
    runs-on: ubuntu-latest
    # Generous: on a tag this waits for apply-prod, which sits behind the production
    # environment's required reviewer. Timing out here is safe — the deploy is
    # re-runnable — but it must not fire just because an approver stepped away.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Does this commit change infrastructure?
        id: touched
        run: |
          # Tags ALWAYS gate: apply-prod is `if: ref_type == 'tag'`, so a tag is the only
          # thing that applies prod infra — and the prod deploy fires on the same tag.
          # Path filters are not applied to tag pushes either, so infra-apply always runs
          # for a tag regardless of what the commit touched.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "infra=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # infra/modules/** counts too: `module "stack"` is a LOCAL path module, so a
          # module-only commit changes the plan and triggers infra-apply.
          if git diff --name-only HEAD~1 HEAD | grep -qE '^infra/(live|modules)/'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Infrastructure · Apply on this commit
        if: steps.touched.outputs.infra == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The sibling run may not be registered the instant this job starts.
          #
          # `|| ID=""` keeps a transient gh/API failure from ending the step: these
          # runners use `set -e`, and an assignment takes its command substitution's exit
          # status, so a rate-limited `gh run list` would skip the retry loop entirely and
          # turn a recoverable blip into a failed gate.
          for _ in $(seq 1 12); do
            ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=infra-apply.yml \
                   --commit "$GITHUB_SHA" \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty') || ID=""
            [ -n "$ID" ] && break
            sleep 10
          done

          if [ -z "${ID:-}" ]; then
            echo "::warning::infra changed but no Infrastructure · Apply run found for $GITHUB_SHA — proceeding."
            exit 0
          fi

          echo "Waiting on infra-apply run $ID …"
          gh run watch --repo "$GITHUB_REPOSITORY" "$ID" --exit-status
          echo "Infrastructure applied; deploy may proceed."

  # ───────────────────────────────────────────────────────────────────────────
  # CI gate — a red main must not deploy.
  #
  #   - push to main → wait for Backend · CI on this sha; `gh run watch --exit-status`
  #     propagates its conclusion, so a failed CI blocks deploy.
  #   - tag push → wait for the DEVELOP deploy of this sha instead. See below.
  #
  # Fails CLOSED: with no CI run found for the sha, block rather than ship blind.
  #
  # WHY THE TAG BRANCH WAITS ON THE DEVELOP DEPLOY, AND NO LONGER EXITS 0.
  # It used to `exit 0` on the grounds that Backend · CI does not run on tags and prod is
  # gated by the production Environment reviewer. Both halves are true and neither is the
  # precondition that matters: a prod deploy does not build, it PROMOTES the sha-<sha>
  # image the develop deploy pushed. So the tag run's real precondition is "develop
  # already built and deployed this sha" — exactly what the promote action's own failure
  # message states ("The commit must be merged to main and deployed to develop before
  # tagging a release"). And the Environment reviewer gates the DEPLOY job, which sits
  # after promote, so it cannot protect promote from running too early.
  #
  # With no gate the two runs race. PORTED FROM RALLY, where prod lost that race on
  # v0.7.13 (2026-08-31): a release merge fires both runs on the same commit, the tag run
  # cleared this gate in 3 seconds while the main run sat here for 15m16s waiting on
  # Backend · CI, and prod then exhausted the promote step's poll budget waiting for an
  # image that did not exist yet — failing 21 seconds before that gate cleared. Nothing
  # half-deployed (promote runs before the deploy job, and it is idempotent), but the
  # release needed a manual re-run and the error named the symptom rather than the cause.
  # qnsc-kb-backend shares the reusable workflow, the promote action and this gate
  # verbatim, so it had the same defect and simply had not cut a release slow enough to
  # expose it.
  #
  # Waiting on the whole develop RUN rather than only its build jobs is deliberate: it is
  # the documented contract, it is one `gh run watch` instead of per-job polling, and it
  # means prod can never ship an image develop itself failed to deploy.
  #
  # NOT-FOUND WARNS RATHER THAN BLOCKING, unlike the main branch below. This workflow's
  # paths-ignore is only `**/*.md` and `docs/**`, so a release commit — which always
  # changes package.json and the release manifest — cannot be skipped, and absence means
  # something unusual: a hand-cut tag, or a deleted run. The promote step's ECR poll is
  # still the backstop, and blocking would turn this gate into a new way to make a
  # release un-shippable. Same warn-and-proceed shape as wait-for-infra above. A develop
  # run that EXISTS and FAILED does block, which is the diagnostic this adds: prod now
  # says "develop deploy failed" in seconds instead of "not found in ECR" after the full
  # poll budget.
  #
  # `timeout-minutes: 45` below already covers awaiting a full develop deploy, so unlike
  # the rally and opshub ports this needed no change.
  # ───────────────────────────────────────────────────────────────────────────
  wait-for-ci:
    name: Wait for Backend · CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for Backend · CI on this commit
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This job does not check out the repo, so gh cannot infer it from a remote.
          for _ in $(seq 1 12); do
            ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow backend-ci.yml \
                   --branch main --commit "$GITHUB_SHA" \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty') || ID=""
            [ -n "$ID" ] && break
            sleep 10
          done
          if [ -z "${ID:-}" ]; then
            echo "::error::No Backend · CI run found for $GITHUB_SHA — blocking deploy (fail closed)."
            exit 1
          fi
          echo "Waiting on Backend · CI run $ID …"
          gh run watch --repo "$GITHUB_REPOSITORY" "$ID" --exit-status
          echo "Backend · CI succeeded; deploy may proceed."

      # Prod promotes the image the develop deploy pushed, so this is the tag run's real
      # precondition. See the block comment above this job for the race it closes.
      - name: Wait for the develop deploy of this commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `--branch main` is what excludes THIS run: the develop deploy's headBranch is
          # `main` while the tag run's is the tag ref, so the two never match each other
          # despite sharing a workflow file and a commit. Without it this would find
          # itself and wait forever.
          #
          # `|| ID=""` on the assignment, matching the gates above and for the same
          # reason: runners use `set -e`, an assignment takes its command substitution's
          # exit status, so a rate-limited `gh run list` would skip the retry loop.
          for _ in $(seq 1 12); do
            ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow backend-deploy.yml \
                   --branch main --commit "$GITHUB_SHA" \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty') || ID=""
            [ -n "$ID" ] && break
            sleep 10
          done

          if [ -z "${ID:-}" ]; then
            echo "::warning::No develop Backend · Deploy run found for $GITHUB_SHA — proceeding, the promote step's ECR poll is the backstop."
            exit 0
          fi

          echo "Waiting on develop Backend · Deploy run $ID …"
          if ! gh run watch --repo "$GITHUB_REPOSITORY" "$ID" --exit-status; then
            echo "::error::The develop deploy of $GITHUB_SHA did not succeed (run $ID). Prod promotes the image that run pushes, so there is nothing to promote. Fix develop, then re-run this deploy."
            exit 1
          fi
          echo "Develop deployed this commit; the sha image exists and prod may promote it."

  deploy:
    needs: [wait-for-infra, wait-for-ci]
    # Must match the UNION of every inner job's own permissions in the reusable
    # backend-deploy.yml, not just its top-level default (contents: read) —
    # GitHub validates a reusable call's whole permission chain at trigger
    # time, and a caller job that only grants the top-level default causes a
    # startup_failure before any job runs, not a runtime denial on the one
    # inner job that needed more. id-token/attestations are for the build and
    # promote jobs' AWS OIDC + provenance attestation steps.
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: read # build-push-ecr pulls private @quynhonsemiconductor/* from GitHub Packages
    uses: quynhonsemiconductor/ci/.github/workflows/backend-deploy.yml@v1
    with:
      product: qnsc-kb
      # ── No registry build cache ────────────────────────────────────────────
      # This repository's `:buildcache` tags total 10.4 GB — worker 5.35, api 4.28,
      # migrator 0.77 — against rova's 0.98 GB. A GitHub-hosted runner sits outside AWS,
      # so every build pulls all of that back out of ECR across the internet, and the
      # matrix pulls the three legs in parallel.
      #
      # Measured account-wide 2026-08-01..16: `APS1-DataTransfer-Out-Bytes` on ECR was
      # 147.3 GB in sixteen days. Storage for the cache is $1.04/mo on top.
      #
      # This repository is PUBLIC, so Actions minutes are unmetered. The cache therefore
      # buys wall-clock and the egress costs real money — and egress grows with deploy
      # frequency, unlike anything else on the bill.
      #
      # WHAT IT COSTS: a cold build every time. The model bake dominates that, so the
      # honest fix for build duration is the ONNX work in docs/embedding-runtime-onnx.md
      # (~2 GB off the image with `allow_patterns` alone), not paying ECR egress to skip
      # a rebuild. If registry cache is ever wanted back, the right answer is a
      # self-hosted runner inside the VPC — same-region traffic is free.
      cache_backend: none
      has_worker: true
      has_migrator: true
      # Celery beat rides in the worker TASK as a second container, so rolling the
      # worker service rolls beat with it — there is no third service to declare.
      #
      # READINESS, not liveness: /health/live returns 200 without touching a dependency,
      # so it cannot tell a working deploy from one whose database or cache is gone.
      # /health/ready checks both.
      health_path: /health/ready
    # Least privilege: pass only what the reusable declares (no `secrets: inherit`).
    secrets:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
