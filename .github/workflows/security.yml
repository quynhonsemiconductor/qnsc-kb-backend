# =============================================================================
# Security · Scan — thin caller of the shared reusable (ci).
#
# Trivy (filesystem + built image), Semgrep, gitleaks, and OSV over the dependency
# lockfile. Language-agnostic: OSV reads poetry.lock directly.
#
# Runs weekly as well as on push, because a CVE published after a merge is invisible
# to a push-triggered scan — the code did not change, the world did.
# =============================================================================
name: Security · Scan

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter here, deliberately — see `push` above, which keeps one.
    #
    # On `pull_request` this filter matches the PR's BASE branch, which is a different
    # question from `push`'s. Set to [main] it means "only run when this PR is aimed at
    # main", so a PR aimed anywhere else — a stacked PR, aimed at the branch below it —
    # got no CI at all, silently, while still reporting green. rova's eight-PR Phase 7
    # stack sat in exactly that state: seven of eight ran nothing but PR-title and labeler.
    #
    # `main` is this repo's only long-lived branch, so the filter skipped nothing anyone
    # wanted skipped. No upside, one silent failure mode.
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC

concurrency:
  # A PUSH TO MAIN IS NEVER CANCELLED, and that takes a group of its own per commit. The group used to be
  # `security-${{ github.ref }}` with cancel-in-progress, so two commits landing on main close together shared
  # `security-refs/heads/main` and the second CANCELLED the first's scan: that commit was left with no scan on record,
  # and the weekly scheduled run (also `refs/heads/main`) could cancel, or be cancelled by, a push.
  #
  # `cancel-in-progress: false` alone would NOT have fixed it: GitHub keeps ONE pending run per group and cancels
  # every other pending one. Only a distinct group per commit keeps them all.
  #
  #   pull_request -> one group per PR, cancel in progress (a newer push to the PR supersedes the older run:
  #                   unchanged behaviour; refs/pull/N/merge was already per PR)
  #   push (main)  -> one group per COMMIT, never cancelled
  #   anything else (schedule, dispatch) -> its own run id, so it can neither cancel nor be cancelled by a push
  #
  # `pr-title.yml` deliberately has its own group and is unaffected.
  group: security-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && format('main-{0}', github.sha) || format('{0}-{1}', github.event_name, github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Replaces Code Scanning Default Setup's `Analyze (actions)` / `CodeQL` as
  # the required gate — those managed checks don't reliably report on
  # bot-authored PRs (Dependabot/Renovate), leaving the required check stuck
  # "Expected" forever.
  actions-security:
    permissions:
      contents: read
      security-events: write
    uses: quynhonsemiconductor/ci/.github/workflows/actions-security.yml@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
    with:
      blocking: true
      combine: true # actionlint + zizmor as ONE job; the required check is now `actions-security / Workflow security (actionlint, zizmor)`

  security:
    # A CEILING, not a grant this workflow uses: the reusable's Trivy job declares
    # `packages: read`, and a called workflow can only REDUCE the caller's permissions,
    # never elevate them. Without it here GitHub rejects the whole workflow before any job
    # runs — a `startup_failure` with no log to read, which looks like the reusable is
    # missing rather than like a permission ceiling.
    permissions:
      contents: read
      security-events: write # SARIF upload
      packages: read
    uses: quynhonsemiconductor/ci/.github/workflows/security.yml@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
    with:
      product: qnsc-kb
      # Gitleaks + osv-scanner + Semgrep as ONE job; the required check is now
      # `security / Security scans (Gitleaks, osv-scanner, Semgrep)`.
      combine: true
      # Trivy runs in `Backend CI`'s Docker build job, on the image that job already builds, instead of building it again here.
      # EXCEPT on the weekly schedule: Backend CI never runs on a schedule, so without this a new CVE in an unchanged image would
      # go unseen until the next code change. The scheduled run builds and scans the image itself, as before.
      scan_container: ${{ github.event_name == 'schedule' }}
      # OSV findings block. The dependency surface here is unusually wide — torch,
      # paddlepaddle, paddleocr, pymupdf and their transitive graph — which is an
      # argument for the gate rather than against it.
      osv_blocking: true
