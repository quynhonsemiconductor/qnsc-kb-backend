# =============================================================================
# Infrastructure · Plan — thin caller of the shared reusable (qnsc-ci).
#
# Dry-run on every PR touching infra: posts a plan comment per changed workspace and
# gates on `tofu fmt`.
# =============================================================================
name: Infrastructure · Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/live/**"
      # modules/** matters too: `module "stack"` is a LOCAL path module, so editing it
      # changes the plan for both environments. Without this a module-only PR merges
      # with no plan reviewed at all, and infra-apply (same filter) then applies it
      # unseen.
      - "infra/modules/**"
      - ".github/workflows/infra-plan.yml"

# Granted at the caller because a reusable workflow can never exceed the caller's token.
# id-token:write is mandatory for the OIDC AssumeRole; without an explicit grant it
# defaults to none and GitHub rejects the whole workflow at compile time ("0 jobs").
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    uses: QNSC-VN/qnsc-ci/.github/workflows/infra-plan.yml@v1.10.0
    with:
      product: qnsc-kb
      # Mirror the apply-time non-secret TF_VARs, or the plan lies. The Cloudflare
      # modules are count-gated on the account id, so without it every plan reports a
      # phantom create/destroy of the Pages project and the DNS record — and a real
      # destroy is easy to miss among them.
      #
      # Safe to read here precisely because CLOUDFLARE_ACCOUNT_ID is an ORG-level
      # variable: those resolve in any job. An ENVIRONMENT-scoped variable would not —
      # a plan job has no `environment:` context, and adding one would gate every PR
      # behind the production reviewer. That is why the remaining public identifiers
      # (tunnel id, OAuth client ids) stay in infra/live/*/variables.tf instead.
      tf_vars_json: |
        {
          "cloudflare_account_id": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
        }
    secrets:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      # Secret half of the apply-time TF_VARs (masked inside the reusable).
      tf_secret_vars_json: |
        {
          "cloudflare_api_token": "${{ secrets.CLOUDFLARE_API_TOKEN }}"
        }
