name: Infrastructure · Apply

# ─────────────────────────────────────────────────────────────────────────────
# Gated the same way as the app deploys:
#   push to main      → apply _shared + develop (auto)
#   push a v*.*.* tag → apply _shared + prod    (prod also behind the "production"
#                       GitHub Environment's required reviewer)
#
# Prod infra can NOT be applied by an ordinary merge to main — only by a deliberate
# semver tag, so an accidental push can never touch production.
#
# PREREQUISITE: the platform shared-runtime stacks in qnsc-infra (runtime-dev for
# develop, runtime-prod for prod) own the shared VPC/NAT/SGs and MUST be applied first.
# Both environments consume them via terraform_remote_state, so a product apply fails if
# that state does not exist yet.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths:
      - "infra/live/**"
      # modules/** matters too: `module "stack"` is a LOCAL path module, so editing it
      # changes the plan for both environments. Without this, a module-only change
      # merged to main is never applied and the plan diverges from reality silently
      # until some later unrelated live/** edit applies both at once.
      - "infra/modules/**"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:

# Serialise by ENVIRONMENT, matching backend-deploy.yml: all prod (tag) applies share
# one group, all develop (branch) applies share another, and the two run in PARALLEL.
#
# A single repo-wide group would make DEVELOP queue behind PROD — and prod waits on a
# required reviewer, so an unapproved production apply would freeze every develop apply
# until a human noticed. The one thing that genuinely must not run twice at once is the
# _shared state, which is fixed at that job instead (see its own concurrency below).
concurrency:
  group: infra-apply-${{ github.repository }}-${{ github.ref_type == 'tag' && 'prod' || 'develop' }}
  cancel-in-progress: false # never cancel a running apply

permissions:
  contents: read

env:
  TOFU_VERSION: "1.9.1"
  AWS_REGION: ap-southeast-1

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Shared (ECR + OIDC roles) — always applies first, on both branch and tag runs.
  # ───────────────────────────────────────────────────────────────────────────
  apply-shared:
    runs-on: ubuntu-latest
    environment: shared
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # mandatory for the OIDC AssumeRole

    # A release pushes main and the vX.Y.Z tag near-simultaneously, so both runs reach
    # this job and would apply the same _shared state concurrently — a state-lock failure
    # on every release. A CONSTANT group here (not keyed on ref) serialises that while
    # leaving the per-environment applies free to run in parallel. The production
    # approval gate lives on apply-prod, a separate job, so a release awaiting a reviewer
    # does not hold this lock.
    concurrency:
      group: infra-apply-shared-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/qnsc-ci/actions/setup-tofu-aws@v1
        with:
          role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-kb-github-infra-apply
          aws-region: ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: infra/live/_shared
        run: tofu init -input=false

      - name: tofu validate
        working-directory: infra/live/_shared
        run: tofu validate

      - name: tofu apply
        working-directory: infra/live/_shared
        run: tofu apply -input=false -auto-approve

  # ───────────────────────────────────────────────────────────────────────────
  # Develop — only on a branch push to main (never on a tag).
  # ───────────────────────────────────────────────────────────────────────────
  apply-develop:
    needs: apply-shared
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment: develop # no approval gate
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # mandatory for the OIDC AssumeRole

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/qnsc-ci/actions/setup-tofu-aws@v1
        with:
          role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-kb-github-infra-apply
          aws-region: ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: infra/live/develop
        run: tofu init -input=false

      - name: tofu validate
        working-directory: infra/live/develop
        run: tofu validate

      - name: tofu apply
        working-directory: infra/live/develop
        run: tofu apply -input=false -auto-approve
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Org-level variable, so it is NOT environment-scoped and resolves in the plan
          # job too — which is what keeps plan and apply honest about the count-gated
          # Cloudflare resources.
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # Short-lived installation token from the RELEASE_BOT App, so no long-lived PAT is
      # needed. Requires "Variables: read and write" on BOTH qnsc-kb repos — the
      # frontend's Pages project name is an output of THIS stack.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        if: ${{ vars.RELEASE_BOT_APP_ID != '' }}
        continue-on-error: true
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            qnsc-kb-backend
            qnsc-kb-frontend

      # Sync the infra ids the deploy workflows read, straight from Terraform outputs, so
      # a rebuild that changes a subnet or security-group id cannot leave them stale.
      #
      # Skipped when no token could be minted. A write may still be rejected — we surface
      # that as a visible ::warning:: naming the variable to reconcile, never a silent
      # green, but never block the apply on it.
      - name: Publish infra ids to the develop environment
        if: ${{ steps.app-token.outputs.token != '' }}
        working-directory: infra/live/develop
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          FRONTEND_REPO: ${{ github.repository_owner }}/qnsc-kb-frontend
        run: |
          set -euo pipefail
          missed=0
          set_var() {
            local repo="$1" name="$2" value="$3"
            if gh variable set "$name" --env develop --repo "$repo" --body "$value"; then
              echo "  set $name on $repo"
            else
              echo "::warning title=infra-id publish::could not set '$name' on $repo — reconcile manually: gh variable set $name --env develop --repo $repo --body '$value'"
              missed=1
            fi
          }

          # ── This repo: what the backend deploy pipeline reads ──
          set_var "$REPO" ECS_CLUSTER           "$(tofu output -raw ecs_cluster_name)"
          set_var "$REPO" ECS_API_SERVICE       "$(tofu output -raw ecs_api_service)"
          set_var "$REPO" ECS_WORKER_SERVICE    "$(tofu output -raw ecs_worker_service)"
          set_var "$REPO" ECS_MIGRATOR_TASK_DEF "$(tofu output -raw ecs_migrator_task_def)"
          set_var "$REPO" ECS_MIGRATOR_SUBNET   "$(tofu output -json private_subnet_ids | jq -r 'join(",")')"
          set_var "$REPO" ECS_MIGRATOR_SG       "$(tofu output -raw sg_app_id)"
          set_var "$REPO" RDS_INSTANCE_ID       "$(tofu output -raw rds_instance_id)"
          set_var "$REPO" APP_URL               "$(tofu output -raw api_url)"

          # ── The FRONTEND repo, because this stack owns the Pages project ──
          # Cross-repo is the price of splitting frontend and backend: the project name
          # and the API origin are outputs here and inputs there. Published rather than
          # typed by hand so the two cannot disagree.
          PAGES_PROJECT="$(tofu output -raw web_pages_project 2>/dev/null || true)"
          if [ -n "$PAGES_PROJECT" ] && [ "$PAGES_PROJECT" != "null" ]; then
            set_var "$FRONTEND_REPO" PAGES_PROJECT "$PAGES_PROJECT"
          else
            echo "::notice::No Pages project yet (cloudflare_account_id unset) — skipping the frontend variables."
          fi
          set_var "$FRONTEND_REPO" APP_URL            "$(tofu output -raw app_url)"
          set_var "$FRONTEND_REPO" VITE_API_BASE_URL  "$(tofu output -raw api_url)/api/v1"

          if [[ $missed -ne 0 ]]; then
            echo "::warning title=infra-id publish::One or more develop infra-id variables were not published — the deploys read these, so verify them against the Terraform outputs."
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Production — only on a v*.*.* tag, and only after a reviewer approves the
  # "production" Environment.
  # ───────────────────────────────────────────────────────────────────────────
  apply-prod:
    needs: apply-shared
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # mandatory for the OIDC AssumeRole

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/qnsc-ci/actions/setup-tofu-aws@v1
        with:
          role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/qnsc-kb-github-infra-apply
          aws-region: ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: infra/live/prod
        run: tofu init -input=false

      - name: tofu validate
        working-directory: infra/live/prod
        run: tofu validate

      - name: tofu apply
        working-directory: infra/live/prod
        run: tofu apply -input=false -auto-approve
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Pin the prod image to the exact release tag that triggered this apply, so an
          # infra apply never resets the task definition to :latest.
          TF_VAR_image_tag: ${{ github.ref_name }}

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        if: ${{ vars.RELEASE_BOT_APP_ID != '' }}
        continue-on-error: true
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            qnsc-kb-backend
            qnsc-kb-frontend

      # NOTE: `production` is a PROTECTED environment, and a GitHub App installation
      # token cannot write variables to one (403 "Resource not accessible by
      # integration"). When that happens we emit a visible warning naming each variable
      # to reconcile rather than a silent green, and do not block the apply. Prod infra
      # ids are deterministic and stable, so they persist between applies; a human
      # reconciles them on the rare rebuild that changes one.
      - name: Publish infra ids to the production environment
        if: ${{ steps.app-token.outputs.token != '' }}
        working-directory: infra/live/prod
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          FRONTEND_REPO: ${{ github.repository_owner }}/qnsc-kb-frontend
        run: |
          set -euo pipefail
          missed=0
          set_var() {
            local repo="$1" name="$2" value="$3"
            if gh variable set "$name" --env production --repo "$repo" --body "$value"; then
              echo "  set $name on $repo"
            else
              echo "::warning title=infra-id publish::could not set '$name' on $repo (a protected environment rejects App-token writes) — reconcile manually: gh variable set $name --env production --repo $repo --body '$value'"
              missed=1
            fi
          }

          set_var "$REPO" ECS_CLUSTER           "$(tofu output -raw ecs_cluster_name)"
          set_var "$REPO" ECS_API_SERVICE       "$(tofu output -raw ecs_api_service)"
          set_var "$REPO" ECS_WORKER_SERVICE    "$(tofu output -raw ecs_worker_service)"
          set_var "$REPO" ECS_MIGRATOR_TASK_DEF "$(tofu output -raw ecs_migrator_task_def)"
          set_var "$REPO" ECS_MIGRATOR_SUBNET   "$(tofu output -json private_subnet_ids | jq -r 'join(",")')"
          set_var "$REPO" ECS_MIGRATOR_SG       "$(tofu output -raw sg_app_id)"
          set_var "$REPO" RDS_INSTANCE_ID       "$(tofu output -raw rds_instance_id)"
          set_var "$REPO" APP_URL               "$(tofu output -raw api_url)"

          PAGES_PROJECT="$(tofu output -raw web_pages_project 2>/dev/null || true)"
          if [ -n "$PAGES_PROJECT" ] && [ "$PAGES_PROJECT" != "null" ]; then
            set_var "$FRONTEND_REPO" PAGES_PROJECT "$PAGES_PROJECT"
          fi
          set_var "$FRONTEND_REPO" APP_URL           "$(tofu output -raw app_url)"
          set_var "$FRONTEND_REPO" VITE_API_BASE_URL "$(tofu output -raw api_url)/api/v1"

          if [[ $missed -ne 0 ]]; then
            echo "::warning title=infra-id publish::One or more production infra-id variables were not published — verify them against the Terraform outputs."
          fi
