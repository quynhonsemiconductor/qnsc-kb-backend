# =============================================================================
# Release · Promote — a vX.Y.Z tag RETAGS the digests already published for that
# commit and opens the reviewed gitops prod PR. It builds NOTHING.
#
# GATED: kb prod is not launched yet (P3: Entra prod apps, Key Vault secrets,
# CNPG prod database). values/kb/tags.prod.yaml is NOT on gitops main yet
# (gitops#255 adds it), so with the gate open the reusable stops with its own
# "no prod values" error — a RED run, not a PR. Set the repository variable
# KB_PROD_PROMOTE_ENABLED=true only when the prod values and the release are
# ready; unset is a clean skip, not red.
#
# `web` is not in `services`: the SPA image is built from qnsc-kb-frontend's own
# commit, which this repository's sha never published. qnsc-kb-frontend therefore
# promotes `web` from its own release tag (qnsc-kb-frontend#155); the two promote
# PRs write different keys of values/kb/tags.prod.yaml.
# =============================================================================
name: Release · Promote

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-promote-kb
  cancel-in-progress: false

jobs:
  wait-for-publish:
    if: ${{ vars.KB_PROD_PROMOTE_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # wait-for-run reads the run list
    steps:
      - uses: quynhonsemiconductor/ci/actions/wait-for-run@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
        with:
          workflow: ghcr-publish.yml
          sha: ${{ github.sha }}
          branch: main
          label: GHCR · Publish
          max-wait-minutes: '45'
          failure-message: "The GHCR · Publish run for this release commit did not succeed, so there is no sha-<12> image to retag. Fix the build, then re-run this release job."
          missing-message: "No GHCR · Publish run exists for this commit. Cut the release from a commit that was published to main."

  promote:
    needs: wait-for-publish
    permissions:
      contents: read
      packages: write
      attestations: read
    # v1.34.1 (not v1.33.1): the promotion branch is unique per SOURCE repository
    # (ci#305). kb promotes from two repositories against the same gitops
    # product, so a shared `promote/kb-<tag>` branch would make the second
    # repository's run collide or exit green without promoting.
    uses: quynhonsemiconductor/ci/.github/workflows/release-promote.yml@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
    with:
      product: kb
      gitops-product: kb
      release-tag: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      services: api worker migrator
    secrets:
      QNSC_AUTOMATION_PRIVATE_KEY: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}
