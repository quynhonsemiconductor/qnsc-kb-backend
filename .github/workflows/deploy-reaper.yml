# =============================================================================
# Deploy Reaper — thin caller of the shared reusable (qnsc-ci).
#
# Fires on the same release tag as Backend·Deploy and cancels any EARLIER deploy run
# still parked on the production Environment reviewer gate.
#
# Why it exists: a parked run holds its deploy concurrency lock (cancel-in-progress is
# false, so prod migrations never race). Nothing releases that lock, so one unapproved
# release blocks every later one — silently, with zero jobs running and no signal.
#
# Why a SEPARATE workflow: workflow-level concurrency queues the entire run, so a reaper
# job inside backend-deploy.yml would be blocked by the very lock it exists to clear.
# Only `waiting` runs are cancelled — those have no compute executing, so a running
# migration can never be interrupted.
# =============================================================================
name: Deploy Reaper

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # same trigger as the deploy workflows

concurrency:
  # Its own group, deliberately NOT deploy-backend-prod: sharing one would queue the
  # reaper behind the lock it is meant to clear.
  group: deploy-reaper
  cancel-in-progress: false

jobs:
  reap:
    uses: QNSC-VN/qnsc-ci/.github/workflows/deploy-reaper.yml@v1.10.0
    # A called workflow can only REDUCE the caller's token scope, so actions:write must
    # be granted here or the reusable cannot cancel anything.
    permissions:
      actions: write
      contents: read
