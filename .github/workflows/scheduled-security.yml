# The repo's ONE scheduled security scan (gitleaks + osv-scanner + the image),
# daily against the default branch. The PR/push gates scan the branch under test;
# this schedule is the net for advisories published AFTER a dependency landed.
# Renovate does not automerge production dependencies (owner decision
# 2026-10-24), so a new advisory must surface here: findings FAIL the run and
# GitHub notifies. It is also the only periodic container scan, so it builds and
# scans the image (scan_container) — the push gate only sees changed images.
# Scan now: gh workflow run scheduled-security.yml
name: Scheduled · Security Scan

on:
  schedule:
    - cron: '15 1 * * *' # UTC; staggered per product so the runner fleet doesn't stack
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/scheduled-security.yml'] # exercise the workflow when it changes

permissions:
  contents: read # read-only: the scheduled run changes nothing

jobs:
  # actionlint + zizmor. The PR gate runs this on every change; the schedule keeps
  # it reporting for a workflow ref whose pinned actions gain a new advisory.
  actions-security:
    permissions:
      contents: read
      security-events: write
    uses: quynhonsemiconductor/ci/.github/workflows/actions-security.yml@400b7e9868e9ba6d172d956a08041ba19b574689 # v1.33.1
    with:
      blocking: true
      combine: true

  security:
    # Job-level permissions REPLACE the inherited set: the reusable's jobs need
    # security-events (SARIF upload) and packages (private @quynhonsemiconductor/*
    # during the image build). A caller granting only contents: read dies at startup.
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: quynhonsemiconductor/ci/.github/workflows/security.yml@400b7e9868e9ba6d172d956a08041ba19b574689 # v1.33.1
    with:
      product: qnsc-kb
      scan_container: true # the only periodic container scan: builds+scans unchanged images too
      osv_blocking: true
