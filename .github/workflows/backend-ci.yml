# =============================================================================
# CI — quality gates on every PR and push to main.
# Gate: format/lint/typecheck → tests → migration upgrade path → docker build →
#       OpenAPI contract diff.
#
# Security scans live in security.yml, which is independently runnable and also
# runs weekly to catch CVEs published between pushes.
#
# The name of this workflow file matters beyond this repo: the deploy pipeline's
# `wait-for-ci` gate looks up a run of `backend-ci.yml` for the exact commit sha and
# FAILS CLOSED when it finds none. Renaming this file without updating
# backend-deploy.yml blocks every deploy.
# =============================================================================
name: Backend · CI

on:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter here, deliberately — see `push` above, which keeps one.
    #
    # On `pull_request` this filter matches the PR's BASE branch, which is a different
    # question from `push`'s. Set to [main] it means "only run when this PR is aimed at
    # main", so a PR aimed anywhere else — a stacked PR, aimed at the branch below it —
    # got no CI at all, silently, while still reporting green. rova's eight-PR Phase 7
    # stack sat in exactly that state: seven of eight ran nothing but PR-title and labeler.
    #
    # `main` is this repo's only long-lived branch, so the filter skipped nothing anyone
    # wanted skipped. No upside, one silent failure mode.
    # Deliberately NOT `edited`. That action exists for the PR-title check, which lives
    # in pr-title.yml. Listening for it here, combined with cancel-in-progress below,
    # means editing a PR title cancels the in-flight real run and replaces it with one
    # that has nothing to do.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  # A PUSH TO MAIN IS NEVER CANCELLED, and that takes a group of its own per commit. The group used to be
  # `ci-backend-${{ github.ref }}` with cancel-in-progress, so two commits landing on main close together shared
  # `ci-backend-refs/heads/main` and the second CANCELLED the first's run. The first commit's deploy then failed its
  # "wait for Backend · CI on this commit" gate: a green commit that could not deploy ("Canceling since a higher
  # priority waiting request for ci-backend-refs/heads/main exists").
  #
  # `cancel-in-progress: false` alone would NOT have fixed it: GitHub keeps ONE pending run per group and cancels
  # every other pending one, so a third push still killed the second's run. Only a distinct group per commit
  # keeps them all.
  #
  #   pull_request -> one group per PR, cancel in progress (a newer push to the PR supersedes the older run:
  #                   unchanged behaviour; refs/pull/N/merge was already per PR)
  #   push (main)  -> one group per COMMIT, never cancelled
  #   anything else (schedule, dispatch) -> its own run id, so it can neither cancel nor be cancelled by a push
  #
  # `pr-title.yml` deliberately has its own group and is unaffected.
  group: ci-backend-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && format('main-{0}', github.sha) || format('{0}-{1}', github.event_name, github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11' # matches the Dockerfile's python:3.11-slim base

jobs:
  # Does this pull request change anything this workflow tests? A change that touches only files the matching DEPLOY workflow ignores
  # (its `paths-ignore`) cannot affect what this workflow builds, so the heavy jobs are skipped and one cheap gate reports instead.
  # A push to main ALWAYS runs everything (deploys wait for that run), and every doubt (API error, empty file list, any file not on
  # the list) runs everything too: see actions/changed-paths in the ci repo.
  changes:
    name: Which parts changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - id: paths
        uses: quynhonsemiconductor/ci/actions/changed-paths@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
        with:
          ignore: |
            **/*.md
            docs/**
          # A release-please PR: only when the author is the release bot (a branch name is chosen by whoever opens the PR, so the
          # prefix alone proves nothing) AND the diff is the changelog, the manifest and `version` lines. The push to main it becomes
          # runs everything. Renovate PRs are NOT skipped: an action bump must be exercised on its PR.
          skip-heads: |
            release-please--@qnsc-automation[bot]=CHANGELOG.md,.release-please-manifest.json,version-only:pyproject.toml

  # ─────────────────────────────────────────────────────────────────────────
  # 1. Format, lint, typecheck — fast gate, no services needed.
  # ─────────────────────────────────────────────────────────────────────────
  quality:
    name: Format & typecheck
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      # Black is blocking: the codebase was formatted in one dedicated commit, so every later PR is checked.
      - name: Format check (black)
        run: poetry run black --check src migrations scripts

      # Blocking. `mypy src` is clean. The package layout is set in pyproject ([tool.mypy]); each module
      # override and each `type: ignore` carries its reason where it is declared.
      - name: Typecheck (mypy)
        run: poetry run mypy src

      # Cheap catch-all that needs no configuration: every module must at least parse.
      - name: Compile all sources
        run: poetry run python -m compileall -q src migrations scripts

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Tests + the RAG regression gate.
  #
  # Postgres carries pgvector because the models declare a Vector column; the stock
  # postgres image cannot create the extension the migrations require.
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qnsc_kb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Valkey, the engine production runs on ElastiCache (same protocol; REDIS_URL unchanged). Service name kept.
      redis:
        image: valkey/valkey:8.1.10-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      PYTHONPATH: .
      # CI talks to a plaintext Postgres; db_ssl.py must not fail closed here.
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/qnsc_kb_test
      REDIS_URL: redis://localhost:6379/0
      # DO NOT set EMBEDDING_MODEL=mock here, however tempting it looks as a way to avoid
      # downloading model weights. `get_bge_embedding` short-circuits to a zero vector on
      # that value, which silently disables
      # tests/unit/test_security_hardening.py::test_embedding_failure_is_not_converted_to_zero_vector
      # — a test whose entire point is that an embedding failure must RAISE rather than
      # return zeros, because a zero vector makes an indexing outage look healthy and
      # contaminates retrieval with meaningless candidates.
      #
      # It is not needed: the tests that touch embeddings monkeypatch the model singleton,
      # so nothing loads real weights.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      # The Postgres service starts EMPTY. Anything that opens the app's lifespan —
      # TestClient(app) as a context manager — runs init_db → bootstrap_rbac, which
      # selects from `permissions` and dies on a schema that was never created. The
      # deployment entrypoint migrates before the API starts; so does this.
      - name: Apply migrations to the test database
        run: poetry run alembic -c migrations/alembic.ini upgrade head

      - name: Unit tests
        run: poetry run pytest -q

      # Proves the DATABASE_SSL_CA decision (src/core/db_ssl.py) against a real Postgres
      # speaking TLS with a self-signed CA (SAN localhost): verify-full connects, a CA the
      # server does not chain to is refused. The fail-closed-in-production case needs no
      # server: it is tests/unit/test_db_ssl.py.
      - name: DB TLS verify-full against a self-signed CA
        run: |
          mkdir certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout certs/ca.key -out certs/ca.crt -days 2 \
            -subj "/CN=db-tls-test-ca" -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" -addext "subjectKeyIdentifier=hash"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout certs/rogue.key -out certs/rogue.crt -days 2 \
            -subj "/CN=rogue-ca" -addext "basicConstraints=critical,CA:TRUE"
          openssl req -newkey rsa:2048 -nodes -keyout certs/server.key -out certs/server.csr -subj "/CN=localhost"
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nbasicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\nauthorityKeyIdentifier=keyid,issuer\nsubjectKeyIdentifier=hash\n' > certs/server.ext
          openssl x509 -req -in certs/server.csr -CA certs/ca.crt -CAkey certs/ca.key \
            -CAcreateserial -out certs/server.crt -days 2 -extfile certs/server.ext
          openssl req -newkey rsa:2048 -nodes -keyout certs/noip.key -out certs/noip.csr -subj "/CN=no-ip-san"
          printf 'subjectAltName=DNS:unrelated-host.internal\nbasicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\nauthorityKeyIdentifier=keyid,issuer\nsubjectKeyIdentifier=hash\n' > certs/noip.ext
          openssl x509 -req -in certs/noip.csr -CA certs/ca.crt -CAkey certs/ca.key \
            -CAcreateserial -out certs/noip.crt -days 2 -extfile certs/noip.ext
          docker run -d --name pg-tls \
            -v "$PWD/certs:/certs" \
            -e POSTGRES_PASSWORD=postgres \
            -p 127.0.0.1:15432:5432 \
            postgres:18.6 bash -c "chown 999:999 /certs/server.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key"
          n=0
          until docker exec pg-tls pg_isready -U postgres >/dev/null 2>&1; do
            n=$((n + 1)); [ "$n" -gt 30 ] && echo "postgres never became ready" && exit 1
            sleep 1
          done
          docker run -d --name pg-wrongname \
            -v "$PWD/certs:/certs" \
            -e POSTGRES_PASSWORD=postgres \
            -p 127.0.0.1:15433:5432 \
            postgres:18.6 bash -c "chown 999:999 /certs/noip.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/certs/noip.crt -c ssl_key_file=/certs/noip.key"
          n=0
          until docker exec pg-wrongname pg_isready -U postgres >/dev/null 2>&1; do
            n=$((n + 1)); [ "$n" -gt 30 ] && echo "wrongname postgres never became ready" && exit 1
            sleep 1
          done
          PG_TLS_URL='postgresql://postgres:postgres@127.0.0.1:15432/postgres' \
          PG_TLS_CA_FILE="$PWD/certs/ca.crt" \
          PG_TLS_ROGUE_CA_FILE="$PWD/certs/rogue.crt" \
          PG_TLS_WRONG_HOST_URL='postgresql://postgres:postgres@127.0.0.1:15433/postgres' \
            poetry run pytest -q tests/integration/test_db_ssl_integration.py

      # Offline mode only sanity-checks the scoring functions against
      # fixtures — it deliberately does NOT claim to measure RAG quality.
      # The real pipeline gate runs via `run-eval-live` below.
      - name: RAG scorer sanity check (offline)
        run: poetry run python scripts/run_eval.py --input evaluation/golden.json

  # ─────────────────────────────────────────────────────────────────────────
  # 2b. Live RAG pipeline gate.
  #
  # Runs the golden questions against a deployed stack through the real
  # retrieval → LLM → citation path. Manual (workflow_dispatch) so it can be
  # pointed at staging with credentials from the environment secrets; wire it
  # into the release gate once a staging environment is standing.
  # ─────────────────────────────────────────────────────────────────────────
  run-eval-live:
    name: RAG regression gate (live)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every other checkout in this file sets it; zizmor blocks on artipacked
          # (credential persistence) at medium severity, and the job needs no git
          # credential after the clone.
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run live evaluation
        env:
          EVAL_API_BASE: ${{ vars.EVAL_API_BASE }}
          EVAL_EMAIL: ${{ secrets.EVAL_EMAIL }}
          EVAL_PASSWORD: ${{ secrets.EVAL_PASSWORD }}
        run: |
          poetry run python scripts/run_eval.py \
            --input evaluation/golden.json \
            --api-base "$EVAL_API_BASE" \
            --email "$EVAL_EMAIL" \
            --password "$EVAL_PASSWORD"

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Migration upgrade path.
  #
  # A fresh database proves a migration is self-consistent; it does NOT prove the
  # migration applies to the schema that is already deployed. This job applies main's
  # migrations first, then the PR's on top — the same order production sees. In
  # production these run unattended in a one-shot task, so a migration that only works
  # against an empty database fails where nobody is watching.
  # ─────────────────────────────────────────────────────────────────────────
  migrations:
    name: Migration upgrade path
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qnsc_kb_upgrade
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: .
      ENVIRONMENT: development # CI talks to a plaintext Postgres; db_ssl.py must not fail closed here
      MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/qnsc_kb_upgrade
      # Exercises the branch that production runs: the RLS policies and the GRANTs to
      # the application role are skipped entirely when this is false, so a CI run
      # without it never executes the half of each migration that matters most.
      ENABLE_RLS: 'true'
      APP_DATABASE_ROLE: qnsc_app
      APP_DATABASE_PASSWORD: ci-not-a-real-password

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need origin/main to build the baseline schema
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      # Advisory, not blocking. Expand/contract is a judgement call — a destructive
      # migration is fine when the code that stopped using the column already shipped —
      # so this surfaces the DDL for a reviewer rather than guessing at intent.
      - name: Expand-contract advisory
        if: github.event_name == 'pull_request'
        run: |
          added=$(git diff origin/main...HEAD -- 'migrations/versions/*.py' \
            | grep -E '^\+' | grep -vE '^\+\+\+' || true)
          if [ -z "$added" ]; then echo "No new migration lines."; exit 0; fi
          pattern='drop_column|drop_table|drop_constraint|alter_column.*nullable=False|RENAME'
          hits=$(echo "$added" | grep -iE "$pattern" | grep -iv 'expand-contract-ok' || true)
          if [ -n "$hits" ]; then
            echo "$hits" | while IFS= read -r line; do
              echo "::warning title=Expand-contract::Backward-incompatible DDL — verify migrate-before-flip safe: ${line#+}"
            done
          else
            echo "No backward-incompatible DDL detected."
          fi

      # Creates the qnsc_app role the RLS migration GRANTs to. Same script the migrator
      # image runs from its entrypoint, so CI exercises that path too rather than
      # assuming it works.
      - name: Bootstrap application role
        run: poetry run python scripts/bootstrap_db_role.py

      # `migrations` AND `src` together, deliberately. The 20260802_00 baseline builds
      # the schema with `Base.metadata.create_all` against the LIVE models, so checking
      # out main's migrations while leaving src at the PR head runs main's history
      # against the PR's models — a combination that exists in no deploy, and which
      # fails as soon as a PR removes a mapped table that main's later migrations still
      # reference by name. Retiring access_groups/user_groups/article_access hit exactly
      # that: main's 20260802_03 indexed a table the PR's models no longer create.
      #
      # Pinning both to main makes phase 1 a faithful "production as it is today", and
      # phase 2 below the real upgrade onto it.
      # `rm -rf migrations` before checking main's copy out, deliberately. A plain
      # `git checkout origin/main -- migrations` overwrites files main also has but
      # LEAVES files only this PR added, and alembic loads the whole directory — so the
      # PR's own revision ran as part of the "baseline", phase 2 became a no-op, and the
      # upgrade path this job exists to test was never exercised. Deleting the directory
      # first makes the baseline exactly main's head, with no leftovers and no shell
      # loop over `git diff` to get wrong.
      - name: Apply baseline (main) migrations
        run: |
          rm -rf migrations
          git checkout origin/main -- migrations src
          poetry run alembic -c migrations/alembic.ini upgrade head
          echo "Baseline head:"
          poetry run alembic -c migrations/alembic.ini current
          rm -rf migrations
          git checkout HEAD -- migrations src

      - name: Apply new migrations on top of baseline
        run: poetry run alembic -c migrations/alembic.ini upgrade head

      # BLOCKING. `alembic check` compares the ORM metadata against the schema the
      # migrations just built, and this is the gate that would have caught
      # connectors.sync_interval_minutes: a column mapped by the model that no migration
      # creates is not a schema lagging behind, it is a query that FAILS AT RUNTIME. It
      # took cloud connector polling down entirely and surfaced only as a beat task
      # dying every five minutes.
      #
      # It ran advisory first rather than being asserted blind. That run reported exactly
      # one item — a check constraint created by SQL and never declared on the model —
      # which is now excluded in env.py beside the twenty indexes in the same category.
      # The diff is empty, so the gate is real rather than aspirational.
      #
      # When this fails: either add the missing migration, or, if the object is genuinely
      # created outside the ORM, add it to the exclusion lists in migrations/env.py with
      # a note saying which migration owns it. Do not reach for --no-verify; the whole
      # value here is that the failure arrives before deploy rather than five minutes
      # into it.
      - name: Model/migration drift
        run: poetry run alembic -c migrations/alembic.ini check

  # ─────────────────────────────────────────────────────────────────────────
  # Local quickstart — the README's commands, from the example env and nothing else.
  # A newcomer's first hour is the most expensive hour this project has, and it breaks silently: the
  # example env drifts from Settings, compose drifts from the env (a `localhost` URL the container cannot
  # reach, a port another stack owns), or a service reports unhealthy forever. This boots the real compose
  # stack (db, redis, migrator, api, worker, beat) from `.env.example` and proves the health endpoint
  # and one authenticated call, so that drift fails a pull request instead of the next person's afternoon.
  # Garage is part of the stack: uploads go to its bucket, and garage-init proves the bucket and its CORS before the API starts.
  #
  # NOT proven here: the real embedding model. The ~2.3 GB bake is skipped (KB_BAKE_EMBEDDING_MODEL=false)
  # and EMBEDDING_MODEL is set to `mock`, so search quality is untested; that path has its own tests and the
  # deployed images carry the model. Everything else is the file as shipped.
  # ─────────────────────────────────────────────────────────────────────────
  quickstart:
    name: Local quickstart
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Copy the example env (the only configuration)
        run: |
          cp .env.example .env
          # The only edits, and only for CI speed: no model bake, zero-vector embeddings.
          sed -i 's/^EMBEDDING_MODEL=.*/EMBEDDING_MODEL="mock"/' .env
          echo 'KB_BAKE_EMBEDDING_MODEL=false' >> .env

      - name: Start Postgres, Redis and Garage
        # garage-init is a one-shot: `--wait` on it flakes, and the app services already wait on its completion.
        run: docker compose up -d --build --wait db redis garage

      - name: Migrate
        run: docker compose --profile migrate run --rm migrator

      - name: Start the API, the worker and beat
        run: docker compose up -d --build api worker beat

      - name: Health endpoint
        run: |
          for i in $(seq 1 60); do
            if body="$(curl -fsS http://localhost:8000/health/ready 2>/dev/null)"; then
              echo "ready after ~$((i * 3))s: $body"
              exit 0
            fi
            sleep 3
          done
          echo "::error::/health/ready never answered 200"
          exit 1

      - name: Authenticated call (the bootstrap administrator from .env.example)
        run: |
          set -euo pipefail
          email="$(sed -n 's/^BOOTSTRAP_ADMIN_EMAIL="\(.*\)"/\1/p' .env.example)"
          password="$(sed -n 's/^BOOTSTRAP_ADMIN_PASSWORD="\(.*\)"/\1/p' .env.example)"
          # Responses go to files and are parsed from there: a `curl | interpreter` pipe is the pattern Semgrep
          # (rightly) flags, and here it would hide a failed request behind the interpreter's exit code.
          curl -fsS -X POST http://localhost:8000/api/v1/auth/login \
            --data-urlencode "username=$email" --data-urlencode "password=$password" -o login.json
          token="$(python3 -c 'import json; print(json.load(open("login.json"))["access_token"])')"
          curl -fsS -H "Authorization: Bearer $token" http://localhost:8000/api/v1/auth/me -o me.json
          python3 -c 'import json; d=json.load(open("me.json")); print("signed in as", d["email"], d["role"]); assert d["role"] == "Admin"'

      - name: Presigned upload through Garage (signature, host and region, end to end)
        # The browser's path, without a browser: the API signs a PUT for the public endpoint, curl sends it to that
        # host, and the object is read back with a presigned GET. A wrong signing version, signature host or region fails
        # here, not in a user's upload.
        run: |
          set -euo pipefail
          key="s3://qnsc-kb-sources-local/qnsc-sources/ci/proof-$GITHUB_RUN_ID.txt"
          put_url="$(docker compose exec -T api python -c "from src.domain import source_storage as s; print(s.create_presigned_source_url('$key', operation='put_object'))")"
          get_url="$(docker compose exec -T api python -c "from src.domain import source_storage as s; print(s.create_presigned_source_url('$key', operation='get_object'))")"
          printf 'garage proof %s\n' "$GITHUB_RUN_ID" > proof.txt
          status="$(curl -sS -o put.out -w '%{http_code}' -X PUT -H 'Content-Type: text/plain' --data-binary @proof.txt "$put_url")"
          test "$status" = "200" || { echo "::error::presigned PUT answered $status"; cat put.out; exit 1; }
          curl -fsS "$get_url" -o got.txt
          cmp proof.txt got.txt && echo "presigned PUT and GET round-trip through Garage"

      - name: The worker answers and beat is scheduling
        run: |
          set -euo pipefail
          docker compose exec -T worker celery -A src.workers.celery_app inspect ping
          for _ in $(seq 1 20); do
            if docker compose logs beat 2>&1 | grep -q "Scheduler: Sending due task"; then echo "beat is sending tasks"; exit 0; fi
            sleep 3
          done
          echo "::error::beat never sent a task"
          exit 1

      - name: Service logs (on failure)
        if: failure()
        run: docker compose ps -a; docker compose logs --no-color --tail=120

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Docker build — all three targets the deploy pipeline ships.
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [quality, test]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      security-events: write # Trivy SARIF upload (no-op on the free plan, lights up after GHAS)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # BAKE_EMBEDDING_MODEL=false: this job proves the Dockerfile BUILDS, and baking
      # ~2.3 GB of weights into the api and worker images would push that through the
      # GitHub Actions cache twice per run for no extra signal. The deploy pipeline
      # builds with the default (true) so the shipped image carries them and no task
      # pays a multi-minute download on its first search.
      # THE CACHE IS WRITTEN FROM main ONLY. Every PR push used to write a mode=max cache for each of the images, into a repository-wide
      # 10 GB cap shared with everything else, and a PR's entry is readable by that PR alone. Writing it evicted the entries main's
      # builds (and every PR's `cache-from`, which falls back to main's) depend on. PRs still READ the cache; a PR's later pushes
      # reuse main's layers. An empty `cache-to` is "do not export".
      - name: Build api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          push: false
          load: true            # the image Trivy scans below; a second build in the security workflow is gone
          tags: qnsc-kb-api:scan
          build-args: |
            BAKE_EMBEDDING_MODEL=false
          cache-from: type=gha,scope=api
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=api' || '' }}

      - name: Build worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          push: false
          build-args: |
            BAKE_EMBEDDING_MODEL=false
          cache-from: type=gha,scope=worker
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=worker' || '' }}

      # CRITICAL blocks this job, hence `Backend CI required`; HIGH is reported. This used to be its own job in the security
      # workflow that rebuilt the same image from scratch.
      - name: Container CVE scan (Trivy)
        uses: quynhonsemiconductor/ci/actions/scan-image@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
        with:
          image-ref: qnsc-kb-api:scan

      - name: Build migrator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrator
          push: false
          cache-from: type=gha,scope=migrator
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=migrator' || '' }}

  # ─────────────────────────────────────────────────────────────────────────
  # 5. OpenAPI contract.
  #
  # The SPA lives in a SEPARATE repo (qnsc-kb-frontend) with a hand-written client, so
  # nothing else in this repository can notice that a rename or a removed endpoint just
  # broke it. oasdiff compares the spec on this branch against main's and fails on a
  # backwards-incompatible change.
  #
  # No database or cache needed: importing the app builds the route table, and
  # validate_production/init_db run on STARTUP, which never happens here.
  # ─────────────────────────────────────────────────────────────────────────
  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      ENVIRONMENT: development # imports src.api.deps, whose engine must not fail closed on a missing CA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Generate OpenAPI spec (this branch)
        run: |
          poetry run python -c "
          import json
          from src.api.main import app
          json.dump(app.openapi(), open('openapi.json', 'w'), indent=2)
          "

      # Three traps here. The first two silently produce a spec for the WRONG commit and
      # so a diff that always reports "no breaking changes"; the third fails the job
      # outright on a PR that has nothing wrong with it:
      #
      #   1. For `python -c`, sys.path[0] is the CWD, which shadows PYTHONPATH. So the
      #      run has to happen from inside the worktree, not from the repo root with
      #      PYTHONPATH pointed at it.
      #   2. The worktree has its own pyproject.toml, so the environment must be
      #      installed against it rather than assumed.
      #   3. main must be imported with MAIN's dependencies, not this branch's. Reusing
      #      the root virtualenv breaks the moment a PR adds or removes a dependency that
      #      main imports: replacing python-jose with PyJWT made `from src.api.main
      #      import app` raise ModuleNotFoundError for a package the PR deliberately
      #      removed, and the job failed on the BASE commit rather than on the change.
      #
      # Installing inside the worktree costs a couple of minutes and resolves 1–3
      # together: poetry keys the virtualenv to the project path, so this is main's own
      # environment, and `poetry run` from that directory is then the correct interpreter.
      - name: Generate OpenAPI spec (main)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git worktree add /tmp/base origin/main
          cd /tmp/base
          poetry install --no-interaction --no-root
          poetry run python -c "
          import json
          from src.api.main import app
          json.dump(app.openapi(), open('/tmp/openapi-base.json', 'w'), indent=2)
          "

      - name: Detect breaking API changes
        if: github.event_name == 'pull_request'
        uses: quynhonsemiconductor/ci/actions/validate-openapi-contract@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0 # v1.10.0
        with:
          current-spec-path: openapi.json
          base-spec-path: /tmp/openapi-base.json

      # Uploaded on every run so the frontend repo has a spec to check its client
      # against, and so a reviewer can read what the API surface became.
      - name: Publish OpenAPI spec
        uses: quynhonsemiconductor/ci/actions/publish-openapi-spec@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0 # v1.10.0
        with:
          spec-path: openapi.json

  # ── The aggregate gate ──────────────────────────────────────────────────────
  # `Backend CI required` is THE required check for this workflow. It exists because GitHub counts a
  # SKIPPED or CANCELLED required check as PASSING, so naming each job in the ruleset
  # cannot catch a job that never ran — the failure mode behind opshub #110 (a title edit
  # cancelled the real run; the replacement skipped every heavy job and went green) and
  # rova #558-#590 (a base-branch filter skipped both CI workflows for stacked PRs, leaving
  # five PRs on 5/5 green with no tests, build, E2E or security scan).
  #
  # `if: always()` is mandatory — without it the gate skips as soon as a dependency fails
  # and inherits the very bug it closes. A cancelled WORKFLOW cancels the gate rather than
  # failing it, so a run superseded by `cancel-in-progress` leaves no red check behind.
  #
  # `needs` MUST list every job that is expected to run. A job outside `needs` is a job
  # outside the gate.
  #
  # `run-eval-live` is deliberately EXCLUDED: it is gated on workflow_dispatch,
  ci-required:
    name: Backend CI required
    if: always()
    needs: [changes, quality, test, migrations, build, openapi, quickstart]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No `allow-skipped`, so a renamed or removed job still fails loudly. The two branches are exclusive:
      #  * `changes` said run: every job must be `success`;
      #  * otherwise: only `changes` itself must be `success` (the rest are skipped by design). If `changes` FAILED its output is
      #    empty, this branch runs, and the gate fails: it cannot turn "could not decide" into a pass.
      - name: Every job must have succeeded
        if: ${{ needs.changes.outputs.run == 'true' }}
        uses: quynhonsemiconductor/ci/actions/assert-jobs-succeeded@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
        with:
          results: ${{ join(needs.*.result, ',') }}

      - name: Nothing here to test (every changed file is ignorable)
        if: ${{ needs.changes.outputs.run != 'true' }}
        uses: quynhonsemiconductor/ci/actions/assert-jobs-succeeded@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
        with:
          results: ${{ needs.changes.result }}
