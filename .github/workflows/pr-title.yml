# =============================================================================
# PR title — conventional commits.
#
# Not style policing: release-please derives the next version and the changelog
# from commit subjects, and this repository squash-merges, so the PR TITLE becomes
# the commit on main. A title it cannot parse produces no release entry at all.
# =============================================================================
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # the area/size labels below; the title check itself only needs read

jobs:
  pr-title:
    name: PR title (conventional commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: the action reads the title from the event payload.
      - uses: quynhonsemiconductor/ci/actions/pr-title-conventional-commits@v1

      # The PR labeler used to be a job of its own (one more runner per push). It runs here, in the same
      # runner, as steps. Not on `edited`: a title edit changes no files, so there is nothing to relabel.
      # `continue-on-error`: this job IS a required check, and a label that cannot be written (a fork PR's
      # read-only token) must never fail the title check.
      - name: Area and size labels
        if: ${{ github.event.action != 'edited' }}
        continue-on-error: true
        uses: quynhonsemiconductor/ci/actions/pr-labels@v1
