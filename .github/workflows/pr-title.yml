# =============================================================================
# PR title — conventional commits.
#
# Not style policing: release-please derives the next version and the changelog
# from commit subjects, and this repository squash-merges, so the PR TITLE becomes
# the commit on main. A title it cannot parse produces no release entry at all.
# =============================================================================
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # required by amannn/action-semantic-pull-request

jobs:
  pr-title:
    name: PR title (conventional commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: the action reads the title from the event payload.
      - uses: quynhonsemiconductor/ci/actions/pr-title-conventional-commits@v1
