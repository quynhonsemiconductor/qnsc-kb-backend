version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # A release is not adopted the day it appears. Most registry compromises are
    # caught within days of publication, and a bot that upgrades within hours turns
    # that window into a merged PR. Applies to the schedule, not to security
    # advisories, which Dependabot still raises immediately.
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "pip"
    # Reads pyproject.toml + poetry.lock. Grouped so a weekly run opens two PRs rather
    # than twenty — this dependency graph is large (torch, paddle, their transitives).
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # A release is not adopted the day it appears. Most registry compromises are
    # caught within days of publication, and a bot that upgrades within hours turns
    # that window into a merged PR. Applies to the schedule, not to security
    # advisories, which Dependabot still raises immediately.
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    ignore:
      # Pinned deliberately in pyproject.toml and NOT safe to bump automatically:
      # torch/paddle carry the NumPy 1.x constraint the OCR stack depends on, and
      # markitdown 0.0.2 is the last release compatible with it. A bot bump here breaks
      # ingestion in a way no unit test would catch.
      - dependency-name: "torch"
      - dependency-name: "paddlepaddle"
      - dependency-name: "paddleocr"
      - dependency-name: "numpy"
      - dependency-name: "markitdown"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # A release is not adopted the day it appears. Most registry compromises are
    # caught within days of publication, and a bot that upgrades within hours turns
    # that window into a merged PR. Applies to the schedule, not to security
    # advisories, which Dependabot still raises immediately.
    cooldown:
      default-days: 7
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps(docker)"
    ignore:
      # paddlepaddle publishes no cp314 wheel, so the worker target cannot install its
      # OCR group on 3.14 — see the ceiling documented at the top of the Dockerfile.
      # The 3.14 bump was raised and merged once already and left main's CI red; without
      # this it is simply raised again next Monday. Drop this entry when paddle ships
      # cp314.
      - dependency-name: "python"
        versions: ["3.14.x"]

  # Shared Terraform modules from qnsc-tf-modules, pinned by git tag as
  # `?ref=<module>-vX.Y.Z`. WITHOUT THIS ECOSYSTEM every module bump is manual, and that
  # is exactly how the drift happened: ecs-cluster sat at v1.0.0 in both products while
  # v2.0.0 was released, and qnsc-infra-template — the repo new products are created from
  # — rotted to ecr v1.1.0, ecs-service v1.3.0 and secrets v1.1.0.
  #
  # `directories` with a GLOB, not a fixed list. A new environment directory is picked up
  # without editing this file — a hand-maintained list of places to look is the same
  # defect the pin-drift report had when it named its consumer repos by hand.
  #
  # chore(deps), not infra(deps): the PR-title check only accepts the conventional-commit
  # types, and a rejected title blocks the very PR this exists to open.
  - package-ecosystem: "terraform"
    directories: ["/infra/live/*", "/infra/modules/*"]
    schedule:
      interval: "weekly"
      day: "monday"
    # A release is not adopted the day it appears. Most registry compromises are
    # caught within days of publication, and a bot that upgrades within hours turns
    # that window into a merged PR. Applies to the schedule, not to security
    # advisories, which Dependabot still raises immediately.
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    # PROVIDERS IGNORED, MODULES UPDATED — and the first half is not optional.
    #
    # Dependabot's terraform updater treats providers and modules as one dependency set.
    # Across several directories it tried to rewrite a `required_providers` block in a
    # file that has none and threw, failing the whole job:
    #
    #   ERROR Error processing hashicorp/aws (RuntimeError)
    #   ERROR Content didn't change!
    #         terraform/lib/dependabot/terraform/file_updater.rb:34
    #
    # So no module updates were produced either — the run failed before opening anything.
    #
    # Ignoring providers is also the right POLICY, not merely a workaround. The `~>`
    # constraints on aws and cloudflare are deliberate, and an automatic major bump of the
    # AWS provider against live state is not something to receive on a Monday morning.
    #
    # `ignore` rather than an `allow` allowlist for the modules: if a new provider is added
    # later, this fails loudly again and gets a decision. An allowlist whose pattern stopped
    # matching would produce NO updates and no error, which is the silent failure this whole
    # effort exists to remove.
    ignore:
      - dependency-name: "hashicorp/*"
      - dependency-name: "cloudflare/*"
